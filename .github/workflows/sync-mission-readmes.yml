name: Sync mission README file lists

on:
  push:
    branches:
      - main
    paths:
      - '미션 */**'
      - 'scripts/sync_mission_readmes.py'
      - '.github/workflows/sync-mission-readmes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mission-readme-sync-main
  cancel-in-progress: false

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update file lists without changing manual descriptions
        run: python3 scripts/sync_mission_readmes.py

      - name: Commit file list changes only when needed
        run: |
          git add -- ':(glob)미션 */README.md'
          if git diff --cached --quiet; then
            echo 'README file lists are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync mission README file lists [skip ci]'
          git push origin HEAD:main
